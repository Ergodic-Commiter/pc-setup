[project]
name = "pc-setup"
version = "0.1.0"
description = "Manage some of my computer files and scripts."
authors = [ {name = "dvillamil+github@gmail.com"} ]
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pylint (>=4.0.5,<5.0.0)"
]

[tool.pylint."MESSAGES CONTROL"]
disable = ["missing-function-docstring", "missing-module-docstring", 
    "trailing-newlines", "trailing-whitespace"]
